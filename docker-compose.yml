services:
  postgres:
    image: postgres:16-alpine
    container_name: secureshelf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: secureshelf_migrator
      POSTGRES_PASSWORD: migrator_dev_password
      POSTGRES_DB: secureshelf
    ports:
      - "5432:5432"
    volumes:
      - secureshelf_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secureshelf_migrator -d secureshelf"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  secureshelf_pgdata:
